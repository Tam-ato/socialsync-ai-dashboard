<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialSync AI - Creative Studio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <!-- Playful Floating Organic Shapes -->
    <div class="blob blob-pink"></div>
    <div class="blob blob-orange"></div>

    <div class="app-wrapper">
        <!-- Agency Top Bar -->
        <header class="studio-header">
            <div class="logo-area">
                <div class="logo-spark"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                <span class="logo-text">SocialSync <span class="highlight-text">Studio</span></span>
            </div>
            <div class="engine-pill">
                <span class="pulse-beacon"></span>
                <span>Gemma-2B Creative Engine</span>
            </div>
        </header>

        <!-- Main Creative Dashboard Layout -->
        <main class="creative-grid">
            <!-- Left Side: Input Panel -->
            <section class="clay-card input-card">
                <div class="card-headline">
                    <div class="pill-icon icon-peach"><i class="fa-solid fa-comment-dots"></i></div>
                    <div>
                        <h2>Raw Client Voice</h2>
                        <p class="card-sub">Drop the messy briefs, captions, or voice transcripts here</p>
                    </div>
                </div>
                <textarea id="rawBrief" placeholder="Example: hey tamanna we are doing 20% off on pastries this saturday morning at our cafe from 8am to noon, tell families to come down and grab croissants..."></textarea>
                <button class="btn-creative-sync" onclick="generateCreativeMatrix()">
                    <span>Transform to Campaign Content</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </section>

            <!-- Right Side: Visual Output Board -->
            <section class="clay-card output-card">
                <div class="card-headline">
                    <div class="pill-icon icon-berry"><i class="fa-solid fa-border-all"></i></div>
                    <div>
                        <h2>Social Channel Matrix</h2>
                        <p class="card-sub">Your cross-platform automated content stream</p>
                    </div>
                </div>

                <div class="matrix-tabs-row">
                    <button class="matrix-tab active" id="instaTab" onclick="switchTab('insta')"><i class="fa-brands fa-instagram"></i> Instagram</button>
                    <button class="matrix-tab" id="linkdTab" onclick="switchTab('linkd')"><i class="fa-brands fa-linkedin"></i> LinkedIn</button>
                </div>

                <div class="workspace-viewport" id="viewportDisplay">
                    <div class="empty-creative-state">
                        <i class="fa-solid fa-palette floating-palette"></i>
                        <p>Awaiting client intake string to spin up your marketing assets...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        function generateCreativeMatrix() {
            const display = document.getElementById('viewportDisplay');
            display.innerHTML = `
                <div class="instagram-preview-card animate-pop">
                    <div class="preview-header">
                        <div class="preview-avatar"><i class="fa-solid fa-store"></i></div>
                        <div class="preview-user">
                            <strong>your.client.cafe</strong>
                            <span>Sponsored • Campaign Node</span>
                        </div>
                    </div>
                    <div class="preview-content-box">
                        <p>✨ <strong>Weekend Plans? Sorted.</strong> ✨<br><br>
                        Looking for the perfect Saturday morning vibe? Bring the whole family down to our cafe this weekend! We are slashing <strong>20% OFF</strong> all pastries from 8:00 AM to 12:00 PM. Yes, including our signature buttery croissants! 🥐☕<br><br>
                        📍 Tag a pastry lover who needs to see this!<br><br>
                        <span class="instagram-tags">#CafeVibes #PastryLovers #WeekendDiscount #LocalBakery #CroissantLove</span>
                        </p>
                    </div>
                    <div class="preview-footer-actions">
                        <button class="btn-copy-asset" onclick="alert('Strategy copied to clipboard!')"><i class="fa-regular fa-copy"></i> Copy Content Block</button>
                    </div>
                </div>
            `;
        }

        function switchTab(platform) {
            document.querySelectorAll('.matrix-tab').forEach(btn => btn.classList.remove('active'));
            if(platform === 'insta') document.getElementById('instaTab').classList.add('active');
            if(platform === 'linkd') document.getElementById('linkdTab').classList.add('active');
        }
    </script>
</body>
</html>
