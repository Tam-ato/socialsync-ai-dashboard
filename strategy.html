
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Campaign Studio | SocialSync AI</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .studio { max-width: 760px; margin: 50px auto; padding: 28px; }
    .studio form { display: grid; gap: 18px; }
    .studio label { display: grid; gap: 8px; font-weight: 600; }
    .studio input, .studio select, .studio textarea {
      width: 100%; padding: 12px; border: 1px solid #ccc;
      border-radius: 8px; font: inherit; box-sizing: border-box;
    }
    .studio textarea { min-height: 120px; resize: vertical; }
    .studio button {
      padding: 13px 18px; border: 0; border-radius: 8px;
      cursor: pointer; font: inherit; font-weight: 700;
    }
    #campaignResult { margin-top: 28px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; }
    #studioStatus { margin-top: 16px; }
    /* Campaign Studio navigation fix */
.site-header {
  width: 100%;
  box-sizing: border-box;
  min-height: 76px;
  padding: 16px 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  background: #ffffff;
  border-bottom: 1px solid #e8eaf0;
}

.site-logo {
  color: #172554;
  font-size: 23px;
  font-weight: 800;
  text-decoration: none;
  white-space: nowrap;
}

.site-logo span {
  color: #6366f1;
}

.site-header .site-nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 28px;
}

.site-header .site-nav a {
  color: #334155;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
}

.site-header .site-nav a:hover,
.site-header .site-nav a[aria-current="page"] {
  color: #6366f1;
}

@media (max-width: 600px) {
  .site-header {
    padding: 16px 5%;
    align-items: flex-start;
    flex-direction: column;
    gap: 16px;
  }

  .site-header .site-nav {
    justify-content: flex-start;
    gap: 12px 20px;
  }
}
  </style>
</head>
<body>
 <header class="site-header">
  <a class="site-logo" href="index.html">SocialSync <span>AI</span></a>

  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="strategy.html" aria-current="page">Campaign Studio</a>
    <a href="how-it-works.html">How It Works</a>
  </nav>
</header>

  <main class="studio">
    <h1>AI Campaign Studio</h1>
    <p>Turn your business goals into a practical, platform-specific campaign plan.</p>

    <form id="campaignForm">
      <label>
        Business name (optional)
        <input id="businessName" maxlength="500" placeholder="Your business name">
      </label>

      <label>
        Business type
        <input id="businessType" required maxlength="1500" placeholder="e.g. sustainable fashion brand">
      </label>

      <label>
        Target audience
        <input id="audience" required maxlength="1500" placeholder="e.g. college students in India">
      </label>

      <label>
        Campaign goal
        <select id="goal" required>
          <option value="">Choose a goal</option>
          <option value="awareness">Brand awareness</option>
          <option value="leads">Generate leads</option>
          <option value="sales">Increase sales</option>
          <option value="community">Build a community</option>
          <option value="authority">Build credibility</option>
          <option value="recruitment">Recruitment</option>
        </select>
      </label>

      <label>
        Social platform
        <select id="platform" required>
          <option value="">Choose a platform</option>
          <option value="instagram">Instagram</option>
          <option value="linkedin">LinkedIn</option>
          <option value="facebook">Facebook</option>
          <option value="tiktok">TikTok</option>
          <option value="youtube">YouTube</option>
          <option value="pinterest">Pinterest</option>
          <option value="google">Google Business Profile</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
      </label>

      <label>
        Campaign brief
        <textarea id="campaignBrief" required maxlength="1500"
          placeholder="What are you promoting? What should people know or do?"></textarea>
      </label>

      <label>
        Preferred tone
        <select id="tone">
          <option>Friendly and professional</option>
          <option>Bold and energetic</option>
          <option>Educational</option>
          <option>Minimal and premium</option>
          <option>Warm and community-focused</option>
        </select>
      </label>

      <label>
        Offer or factual details (optional)
        <textarea id="offerDetails" maxlength="500"
          placeholder="Real offer, price, event date, or other verified details"></textarea>
      </label>

      <label>
        Available creative resources (optional)
        <input id="visualResources" maxlength="500"
          placeholder="e.g. phone camera, product photos, no video team">
      </label>

      <button id="generateButton" type="submit">Generate campaign plan</button>
    </form>

    <p id="studioStatus" role="status" aria-live="polite"></p>
    <article id="campaignResult" aria-live="polite"></article>
  </main>

  <script src="strategy.js" defer></script>
</body>
</html>
